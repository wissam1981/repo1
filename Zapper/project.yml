name: Zapper
options:
  bundleIdPrefix: com.zapper
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  buildSettings:
    SWIFT_VERSION: "6.0"

packages:
  SwiftProtobuf:
    url: https://github.com/apple/swift-protobuf.git
    from: 1.28.0

targets:
  Zapper:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Zapper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zapper.remote
        SWIFT_VERSION: 6.0
        INFOPLIST_FILE: Zapper/Info.plist
    dependencies:
      - package: SwiftProtobuf
    info:
      path: Zapper/Info.plist
      properties:
        NSLocalNetworkUsageDescription: "Zapper needs local network access to discover and control your smart TVs."
        NSBonjourServices:
          - _androidtvremote2._tcp

  ZapperTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - ZapperTests
    dependencies:
      - target: Zapper
    settings:
      base:
        SWIFT_VERSION: 6.0
